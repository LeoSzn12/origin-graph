services:
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    environment:
      POSTGRES_DB: origin_graph
      POSTGRES_USER: origin_graph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origin_graph -d origin_graph"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - origin_graph_pgdata:/var/lib/postgresql/data

volumes:
  origin_graph_pgdata:
